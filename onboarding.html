<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome | Misfits & Nomads</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f7f7f7;color:#171717}.wrap{max-width:760px;margin:0 auto;padding:50px 20px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:32px}.step{display:none}.step.active{display:block}h1{font-size:40px;letter-spacing:-.04em}.muted{color:#737373}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:24px 0}.choice{padding:14px;border:1px solid #e5e5e5;border-radius:10px;background:#fff;text-align:left}.choice.active{border-color:#2f5d50;background:#f0f5f3}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #e5e5e5;border-radius:10px;font:inherit}.actions{display:flex;justify-content:space-between;margin-top:26px}.btn{padding:12px 18px;border-radius:10px;border:1px solid #d4d4d4;background:#fff;font-weight:800}.primary{background:#2f5d50;color:#fff;border-color:#2f5d50}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <meta name="theme-color" content="#ffffff">
</head><body><main class="wrap"><div class="card"><div class="step active" data-step="1"><p class="muted">Step 1 of 3</p><h1>What are you into?</h1><p class="muted">Choose up to five interests. You can change these later.</p><div class="choices" id="choices"></div></div><div class="step" data-step="2"><p class="muted">Step 2 of 3</p><h1>Where are you?</h1><p class="muted">Use a general city or region. Exact locations are never required.</p><div class="field"><label>City or region</label><input id="city" placeholder="San Diego, CA"></div></div><div class="step" data-step="3"><p class="muted">Step 3 of 3</p><h1>Finish your profile.</h1><div class="field"><label>Short bio</label><textarea id="bio" rows="4" placeholder="A little about you..."></textarea></div><div class="field"><label><input id="meetups" type="checkbox"> Open to local meetups</label></div><div class="field"><label><input id="messages" type="checkbox" checked> Open to messages</label></div></div><div class="actions"><button class="btn" id="back" disabled>Back</button><button class="btn primary" id="next">Continue</button></div></div></main><script>const interests=['Coffee','Photography','Gaming','Food','Travel','Books','Music','Fitness','Movies','Outdoors'];let step=1,selected=[];const box=document.querySelector('#choices');interests.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.addEventListener('click',()=>{if(selected.includes(x)){selected=selected.filter(i=>i!==x);b.classList.remove('active')}else if(selected.length<5){selected.push(x);b.classList.add('active')}});box.appendChild(b)});function show(){document.querySelectorAll('.step').forEach(s=>s.classList.toggle('active',+s.dataset.step===step));back.disabled=step===1;next.textContent=step===3?'Enter community':'Continue'};back.onclick=()=>{step--;show()};next.onclick=()=>{if(step<3){step++;show();return}const p=JSON.parse(localStorage.getItem('mn_profile')||'{}');Object.assign(p,{interests:selected,city:city.value,bio:bio.value,meetups:meetups.checked,messages:messages.checked});localStorage.setItem('mn_profile',JSON.stringify(p));location.href='app.html'};show();</script>
<script>
if(window.netlifyIdentity){netlifyIdentity.on('init',user=>{if(!user)location.replace('index.html?auth=login')})}
document.addEventListener('click',e=>{if(e.target.closest('a[href="app.html"],button[type="submit"]'))localStorage.setItem('mn_onboarding_complete','true')});
</script>
</body></html>
