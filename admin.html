<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISNÖ Admin</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>:root{--line:#e6e6e2;--muted:#72726e;--soft:#f7f7f5;--ink:#171717}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--soft);color:var(--ink)}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:26px 18px}.logo{width:145px;margin-bottom:34px}.side a,.side button{display:block;width:100%;padding:11px 12px;border:0;background:transparent;text-align:left;border-radius:9px;margin-bottom:4px;color:#444}.side a:hover,.side button:hover{background:#f1f2f0}.main{padding:38px 46px}.head h1{font-size:38px;margin:0 0 8px}.head p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px}.card strong{font-size:30px}.table{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border:0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><img src="misno-logo.png" class="logo" alt="MISNÖ"><a href="app.html">Return to community</a><button id="signout">Sign out</button></aside><main class="main"><div class="head"><h1>Admin</h1><p>A simple view of members, reports, and community activity.</p></div><div class="grid"><div class="card"><strong>248</strong><p class="muted">Members</p></div><div class="card"><strong>6</strong><p class="muted">Open reports</p></div><div class="card"><strong>12</strong><p class="muted">Upcoming experiences</p></div></div><h2>Recent members</h2><div class="table"><div class="row"><strong>Maya Ö</strong><span>Community</span><span class="muted">Active</span><button class="btn">View</button></div><div class="row"><strong>Kai Ö</strong><span>Contributor</span><span class="muted">Active</span><button class="btn">View</button></div><div class="row"><strong>Leilani Ö</strong><span>Partner</span><span class="muted">Review</span><button class="btn">View</button></div></div></main></div><script>if(window.netlifyIdentity){netlifyIdentity.on('init',u=>{const roles=u?.app_metadata?.roles||[];if(!u||!roles.includes('admin'))location.href='app.html'});document.getElementById('signout').onclick=()=>netlifyIdentity.logout().then(()=>location.href='index.html')}</script></body></html>
